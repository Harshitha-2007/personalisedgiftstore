<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Login | Harshitha Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- Back to Landing Page -->
            <a href="index.html" class="back-link">
                ← Back to roles
            </a>


            <!-- Brand Logo -->
            <div class="login-logo">
                H
            </div>


            <!-- Brand Name -->
            <p class="login-label">
                HARSHITHA MART
            </p>


            <h1>
                Welcome back!
            </h1>


            <p class="login-description">
                Sign in to explore beautiful gifts made special for you.
            </p>


            <!-- Login Form -->
            <form id="buyerLoginForm">

                <!-- Email -->
                <div class="input-group">

                    <label for="buyerEmail">
                        Email or Phone Number
                    </label>

                    <input
                        type="text"
                        id="buyerEmail"
                        placeholder="Enter your email or phone number"
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="buyerPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="buyerPassword"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Remember + Forgot -->
                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- Social Login -->
            <div class="social-login">

                <button
                    type="button"
                    class="social-button"
                >
                    Continue with Google
                </button>


                <button
                    type="button"
                    class="social-button"
                >
                    Continue with Apple
                </button>

            </div>


            <!-- Sign Up -->
            <p class="signup-text">

                New to Harshitha Mart?

                <a href="#">
                    Create an account
                </a>

            </p>


            <!-- Demo Notice -->
            <p class="demo-note">
                Welcome to Harshitha Mart — your personalised gifting destination.
            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
