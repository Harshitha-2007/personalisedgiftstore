<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | Harshitha</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7f5;
            color: #222;
        }

        .navbar {
            background: #164734;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: #24664c;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .title {
            margin-bottom: 25px;
            color: #164734;
        }

        .cart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 70px 1fr 120px 100px 80px;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .product-icon {
            width: 60px;
            height: 60px;
            background: #e8f1ec;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .product-name {
            font-weight: bold;
            color: #164734;
        }

        .product-price {
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 5px;
            background: #164734;
            color: white;
            cursor: pointer;
        }

        .remove-btn {
            border: none;
            background: #e74c3c;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 10px;
            color: #666;
        }

        .summary {
            margin-top: 25px;
            margin-left: auto;
            max-width: 350px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 16px;
        }

        .grand-total {
            border-top: 2px solid #164734;
            padding-top: 15px;
            font-size: 21px;
            font-weight: bold;
            color: #164734;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #164734;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #24664c;
        }

        @media (max-width: 700px) {
            .cart-item {
                grid-template-columns: 55px 1fr;
                gap: 12px;
            }

            .product-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .product-price,
            .quantity,
            .remove-btn {
                grid-column: 2;
            }

            .navbar {
                padding: 15px 5%;
            }

            .brand {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="brand">Harshitha</div>
        <a href="home.html" class="back-btn">← Continue Shopping</a>
    </nav>

    <div class="container">

        <h1 class="title">🛒 My Cart</h1>

        <div class="cart-box">

            <div id="cartItemsContainer"></div>

            <div class="summary">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span id="delivery">₹0</span>
                </div>

                <div class="summary-row grand-total">
                    <span>Total</span>
                    <span id="grandTotal">₹0</span>
                </div>

                <button class="checkout-btn" onclick="checkout()">
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function displayCart() {

            const container = document.getElementById("cartItemsContainer");
            const subtotalElement = document.getElementById("subtotal");
            const deliveryElement = document.getElementById("delivery");
            const grandTotalElement = document.getElementById("grandTotal");

            container.innerHTML = "";

            if (cart.length === 0) {

                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty 🛒</h2>
                        <p>Add some products to your cart.</p>
                    </div>
                `;

                subtotalElement.textContent = "₹0";
                deliveryElement.textContent = "₹0";
                grandTotalElement.textContent = "₹0";

                return;
            }

            let subtotal = 0;

            cart.forEach(function(item, index) {

                const itemTotal = item.price * item.quantity;

                subtotal += itemTotal;

                const cartItem = document.createElement("div");

                cartItem.className = "cart-item";

                cartItem.innerHTML = `
                    <div class="product-icon">${item.icon}</div>

                    <div>
                        <div class="product-name">${item.name}</div>
                    </div>

                    <div class="product-price">
                        ₹${item.price}
                    </div>

                    <div class="quantity">
                        <button onclick="decreaseQuantity(${index})">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="increaseQuantity(${index})">+</button>
                    </div>

                    <button class="remove-btn"
                        onclick="removeItem(${index})">
                        Remove
                    </button>
                `;

                container.appendChild(cartItem);
            });

            const delivery = subtotal >= 1000 ? 0 : 50;

            const total = subtotal + delivery;

            subtotalElement.textContent = "₹" + subtotal;
            deliveryElement.textContent = delivery === 0 ? "FREE" : "₹" + delivery;
            grandTotalElement.textContent = "₹" + total;
        }


        function increaseQuantity(index) {

            cart[index].quantity++;

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function decreaseQuantity(index) {

            if (cart[index].quantity > 1) {

                cart[index].quantity--;

            } else {

                cart.splice(index, 1);
            }

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }

            alert("Checkout feature coming soon!");

        }


        displayCart();
    </script>

</body>
</html>
